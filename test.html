 <!DOCTYPE html>
    <html>
        
    <head>
        <title>Home</title>
        <!-- <link rel="stylesheet" href="style/main.css"> -->

        <style>
            @font-face {
                font-family: 'Project Blackbird';
                src: url('fonts/projekt-blackbird-v2.otf') format('opentype'); /* Adjust path */
                font-weight: normal;
                font-style: normal;
            }
            body {
                margin: 0;
                padding: 0; /* Optional: Resets internal padding if any */
                /* background-color: #120e0e; */
                font-family: 'Project Blackbird'; /* Add fallback */
                position: relative;
            }

            .header-container {
                position: relative;
                width: 100%;
                height: 3svw;
                background-color: rgb(134, 138, 136); /* Optional */
                display: grid;
                grid-template-columns: auto auto auto auto;
            }

            .header-container div{
                display: grid;
                font-size: 22px;
                text-align: center;
                align-items: center;
                /* height: 100%; */
                background-color: aqua;
                outline: 5px solid red;
            }

            .display-container {
                position: relative;
                width: 100%;
                height: 30svw;
                background-color: rgb(134, 138, 136); /* Optional */
                display: grid;
                /* padding: 20px; */
                grid-template-columns: auto auto;
            }

            .display-box {
                width: 100%;
                height: 500px;
                /* width: fit-content; */
                /* height: 100%; */
                background-color: rgb(36, 184, 110); /* Optional */
                display: grid;
                /* object-fit: contain; */
            }

            .display-box img {
                /* width: 50svw; */
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: relative;
            }

            .display-text {
                width: 100%;
                height: 500px;
                /* width: fit-content; */
                /* height: 100%; */
                background-color: rgb(93, 117, 35); /* Optional */
                display: grid;
                /* object-fit: contain; */
            }


        </style>
    </head>
    <body>

        <div class="header-container">
            <div>Engineering</div>
            <div>Characters</div>
            <div>Environments</div>
            <div>Matt Hughes <br> Artist and Engineer</div>
        </div>

        <div class="display-container">
            <!-- <div class="display-box">

            </div>
            <div class="display-text">Hello this is text</div> -->
        </div>


        
    </body>
    </html>
