<html >
<head>
    <title>Trailer</title>
    <link rel="stylesheet" href="../../style/main.css">
    <link rel="stylesheet" href="../../style/post.css">

    <style>
    .main_video {
        height: 75%;
        position: relative;
        left: 50%;
        transform: translate(-50%, 0);
    }


    .img_grid {
        display: grid;
        grid-template-columns: auto auto auto auto;
        position: relative;
        left: 0%;
        top: 0%;
        }

    .img_grid img {
        position: relative;
        width: 70%;
        left: 40%;
        top: 00%;
        transform: translate(-50%, 0%);
        background-color: brown;
    }

    .img_grid3 {
        display: grid;
        grid-template-columns: auto auto auto;
        position: relative;
        left: 0%;
        top: 0%;
        }

    .img_grid3 img {
        position: relative;
        width: 90%;
        left: 50%;
        top: 00%;
        transform: translate(-55%, 0%);
        background-color: brown;
    }

    .vid_grid {
        display: grid;
        grid-template-columns: auto auto;
        position: relative;
    }

    .vid_grid video {
        position: relative;
        /* width: 40%; */
        left: 50%;
        top: 50%;
        transform: translate(-60%, -50%);
        margin-left: 20%;
        margin-right: 20%;
        margin-bottom: 5%;
    }

    .vid_grid div {
        position: relative;
        /* background-color: brown; */
        width: 50vw;
        height: 40vw;
        margin: 5%;
    }

    .vid_grid div iframe {
        position: relative;
        left: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
        /* margin-left: 5%; */
        height: max-content;
        width: 100%;
        height: 60%;
    }

    .vid_grid3 {
        display: grid;
        grid-template-columns: auto auto auto;
        position: relative;
    }

    .vid_grid3 video {
        position: relative;
        width: 50%;
        top: 50%;
        transform: translate(0%, -50%);
        margin-left: 20%;
        margin-right: 20%;
        margin-bottom: 5%;
    }

    .last {
        display: grid;
        grid-template-columns: auto auto;
        position: relative;
    }

    .last_text {
        position: absolute;
        /* background-color: rgb(64, 54, 158); */
        width: 50%;
        left: 35%;
        top: 20%;
        text-align: left;

        color: rgba(255,255,255,0.749);
        font-family: 'Oswald', sans-serif;
        letter-spacing: 0.075rem;
        width: 50%;
        font-size: 2em;
        line-height: 1.25;
        font-weight: 500;
}

    .sketchfab-embed-wrapper iframe {
        position: relative;
        width: 50svw;
        height: 30svw;
        margin-left: 5svw;
    }

    .sad {
        position: relative;
        /* background-color: rgb(22, 22, 22); */
        margin-bottom: 15px;
        /* left: 20%; */
        margin-left: 20px;

        text-transform: uppercase;
        color: #FFFFFF;
        font-family: 'Oswald', sans-serif;
        letter-spacing: 0.4rem;
        width: max-content;
        font-size: 1.25em;
        line-height: 1.25;
        font-weight: 600;
    }
    </style>
</head>


<body>

    <header id="header-container"></header>
    <div style="margin-bottom: 70px;"></div>

    <div class="sad">Unfortunately, this project is not finished yet... check back later!</div>

    <script src="../../scripts/header.js" defer></script>


    
</body>
</html>
