<!DOCTYPE html>

<head>
    <title>Bingus</title>
        <!-- <link rel="stylesheet" href="style/main.css"> -->
    <link rel="icon" type="image/x-icon" href="../../images/end2.ico">

    <style>
        @font-face {
                font-family: 'Project Blackbird';
                src: url('../../fonts/projekt-blackbird-v2.otf') format('opentype'); /* Adjust path */
                font-weight: normal;
                font-style: normal;
            }
            body {
                margin: 0;
                padding: 0; /* Optional: Resets internal padding if any */
                background-color: #2c2c2c;
                font-family: 'Project Blackbird'; /* Add fallback */
                position: relative;
            }
            
             iframe {
                width: 100%;
                height: 100%;
            }

            .header{
                position: relative;
                width: calc(100%-20px);
                height: 3svw;
                background-color: rgb(0, 0, 0); /* Optional */
                display: grid;
                /* grid-template-columns: auto auto auto auto; */
                /* padding: 5px; */
            }

            .main-container {
                position: relative;
                width: calc(100%-20px);
                height: 30svw;
                background-color: rgb(26, 26, 26);
                /* display: grid; */
                /* grid-template-columns: auto auto; */
                /* padding: 5px; */
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .main-content {
                /* background-color: aqua; */
                width: 100%;
                height: 100%;
                /* display: grid; */
            }

            .main-content iframe {
                position: relative;
                height: 100%;
                left: 50%;
                transform: translate(-50%, 0);
            }

            .title {
                width: calc(100%-20px);
                height: fit-content;
                background-color: rgb(0, 0, 0);
                font-size: 2.8cqi;
                color: white;
                padding: 10px;
            }

            .description {
                width: 70%;
                font-size: 1.2cqi;
                /* background-color: black; */
                color: white;
                padding: 10px;
                padding-bottom: 30px;
            }

            .img-set {
                position:relative;
                display:inline-block;
                width:100%;
                height: fit-content;
                overflow:hidden;
                /* margin:10px; */
                /* background:lightgrey; */
                display: grid;
            }


            .display-img {
                position:relative;
                /* top:50%;
                left:50%; */
                /* max-width:100%;
                max-height:60svh; */
                max-width: 90%;
                left: 50%;
                transform:translate(-50%, 0);
                max-height: 60svh;
                padding-top: 10px;
            }

            .home-button {
                text-transform: uppercase;
                /* font-family: 'Oswald', sans-serif; */
                letter-spacing: 0.4rem;
                width: max-content;
                font-size: 1.25em;
                line-height: 1.25;
                font-weight: 600;
                position: relative;
                color: #FFFFFF;
                top: 30%;
                margin-left: 20px;
                text-decoration: none;
            }

            .home-button:hover {
                color: rgb(233, 233, 233);
            }

            .main-img {
                position: relative;
                height: 100%;
                left: 50%;
                top: 50%;
                transform:translate(-50%, -50%);
            }

            .img-set iframe {
                width: 90%;
                position: relative;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
    </style>
</head>

<body>
    <div class="header">
        <a class="home-button" href="../../index.html">Back to Home</a>
    </div>

    <div class="main-container">
        <div class="main-content">
            <img src="3358.webp" alt="" class="main-img">
        </div>
        
    </div>

    <div class="title">
        Walking Dog
    </div>

    <div class="description">
        A dog animatronic designed to use accelerometers and machine learning to self-balance.
        This project is still in progress.
         <br><br>
        Skills: Mechanical Design, Electronics, Programming.
    </div>
